name: Build OPLCOV1 ELF

on:
  push:
    branches:
      - oplcov1
  workflow_dispatch:

jobs:
  build:
    name: HDLGameInstaller v0.821 baseline
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:v1.0

    steps:
      - name: Install dependencies
        run: |
          apk add build-base git zip

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch working tree to official v0.821 source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force
          git checkout v0.821 -- .
          git status --short

      - name: Compile exactly like official workflow
        run: |
          make
          cp HDLGameInstaller.elf HDLGameInstaller_v0821_BASELINE_OFFICIAL_ENV.elf
          file HDLGameInstaller_v0821_BASELINE_OFFICIAL_ENV.elf
          sha256sum HDLGameInstaller_v0821_BASELINE_OFFICIAL_ENV.elf

      - name: Upload baseline ELF
        uses: actions/upload-artifact@v4
        with:
          name: HDLGameInstaller-v0821-baseline-official-env
          path: HDLGameInstaller_v0821_BASELINE_OFFICIAL_ENV.elf
