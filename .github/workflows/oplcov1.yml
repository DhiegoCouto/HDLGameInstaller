name: Build OPLCOV1 ELF

on:
  push:
    branches:
      - oplcov1
  workflow_dispatch:

jobs:
  build:
    name: HDLGameInstaller v0.821 baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch working tree to official v0.821 source
        run: |
          git remote add upstream https://github.com/ps2homebrew/HDLGameInstaller.git || true
          git fetch upstream tag v0.821 --force
          git checkout v0.821 -- .
          git status --short

      - name: Compile with official PS2DEV v1.0 image
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ps2dev/ps2dev:v1.0 \
            sh -c 'set -e; echo "$PATH"; command -v ee-gcc; apk add --no-cache build-base git zip; make; cp HDLGameInstaller.elf HDLGameInstaller_v0821_BASELINE_OFFICIAL_ENV.elf; file HDLGameInstaller_v0821_BASELINE_OFFICIAL_ENV.elf; sha256sum HDLGameInstaller_v0821_BASELINE_OFFICIAL_ENV.elf'

      - name: Upload baseline ELF
        uses: actions/upload-artifact@v4
        with:
          name: HDLGameInstaller-v0821-baseline-official-env
          path: HDLGameInstaller_v0821_BASELINE_OFFICIAL_ENV.elf
