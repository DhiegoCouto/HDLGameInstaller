name: Build OPLCOV1 ELF

on:
  push:
    branches:
      - oplcov1
  workflow_dispatch:

jobs:
  build:
    name: HDLGameInstaller OPLCOV1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply OPLCOV1 patch on runner
        run: python3 oplcov1/patch_oplcov1.py "$GITHUB_WORKSPACE"

      - name: Compile inside current PS2DEV container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ps2dev/ps2dev:latest \
            sh -lc 'command -v make >/dev/null 2>&1 || apk add --no-cache make; export PS2DEV=/usr/local/ps2dev; export PS2SDK=$PS2DEV/ps2sdk; export GSKIT=$PS2DEV/gsKit; export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin; make EE_CFLAGS="-D_EE -DNEWLIB_PORT_AWARE -Os -mgpopt -G9760 -mno-abicalls -fno-pic" && cp HDLGameInstaller.elf HDLGameInstaller_OPLCOV1.elf'

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: HDLGameInstaller-OPLCOV1
          path: HDLGameInstaller_OPLCOV1.elf
