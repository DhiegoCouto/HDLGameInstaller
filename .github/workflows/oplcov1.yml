name: Build OPLCOV1 ELF

on:
  push:
    branches:
      - oplcov1
  workflow_dispatch:

jobs:
  build:
    name: HDLGameInstaller v0.821 packed baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch working tree to official v0.821 source
        run: |
          git remote add upstream https://github.com/ps2homebrew/HDLGameInstaller.git || true
          git fetch upstream tag v0.821 --force
          git checkout v0.821 -- .
          git status --short

      - name: Compile HDLGameInstaller with PS2DEV v1.0
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ps2dev/ps2dev:v1.0 \
            sh -c '
              set -e
              apk add --no-cache build-base git zip
              make
              cp HDLGameInstaller.elf HDLGameInstaller_v0821_UNPACKED.elf
              file HDLGameInstaller_v0821_UNPACKED.elf
              sha256sum HDLGameInstaller_v0821_UNPACKED.elf
            '

      - name: Pack baseline with current ps2-packer on PS2DEV v1.3.0
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ps2dev/ps2dev:v1.3.0 \
            sh -lc '
              set -e
              apk add --no-cache build-base git zip
              rm -rf /tmp/ps2-packer
              git clone --depth 1 https://github.com/ps2dev/ps2-packer.git /tmp/ps2-packer
              cd /tmp/ps2-packer
              sed -i "s/-Werror//g" stub/Makefile stub/zlib/Makefile stub/lzo/Makefile 2>/dev/null || true
              make ps2-packer-lite LZMA_MT=0
              ./ps2-packer-lite -v /src/HDLGameInstaller_v0821_UNPACKED.elf /src/HDLGameInstaller_v0821_PACKED.elf
              cd /src
              file HDLGameInstaller_v0821_PACKED.elf
              mips64r5900el-ps2-elf-readelf -h -l HDLGameInstaller_v0821_PACKED.elf || true
              sha256sum HDLGameInstaller_v0821_PACKED.elf
            '

      - name: Upload packed baseline pair
        uses: actions/upload-artifact@v4
        with:
          name: HDLGameInstaller-v0821-packed-baseline
          path: |
            HDLGameInstaller_v0821_UNPACKED.elf
            HDLGameInstaller_v0821_PACKED.elf
