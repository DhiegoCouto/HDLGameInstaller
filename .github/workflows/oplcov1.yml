name: Build OPLCOV1 ELF

on:
  push:
    branches:
      - oplcov1
  workflow_dispatch:

jobs:
  build:
    name: HDLGameInstaller OPLCOV1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch and compile inside PS2DEV container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ps2dev/ps2dev:v1.0 \
            sh -lc 'apk add build-base git python3 && python3 oplcov1/patch_oplcov1.py /src && make && cp HDLGameInstaller.elf HDLGameInstaller_OPLCOV1.elf'

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: HDLGameInstaller-OPLCOV1
          path: HDLGameInstaller_OPLCOV1.elf
