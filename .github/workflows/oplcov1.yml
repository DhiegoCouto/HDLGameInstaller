name: Build OPLCOV1 ELF

on:
  push:
    branches:
      - oplcov1
  workflow_dispatch:

jobs:
  build:
    name: HDLGameInstaller OPLCOV1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply only SDK compatibility patch
        run: |
          python3 oplcov1/patch_legacy_sdk.py "$GITHUB_WORKSPACE"

      - name: Build baseline with PS2DEV v1.3.0
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ps2dev/ps2dev:v1.3.0 \
            sh -lc 'set -e; apk add --no-cache build-base git zip; make EE_CFLAGS="-D_EE -DNEWLIB_PORT_AWARE -include io_common.h -include errno.h -include malloc.h -std=gnu89 -Wno-implicit-function-declaration -Os -mgpopt -G9760"; cp HDLGameInstaller.elf HDLGameInstaller_BASELINE_GCC11.elf; make clean'

      - name: Apply OPLCOV1 patch
        run: |
          python3 oplcov1/patch_oplcov1.py "$GITHUB_WORKSPACE"

      - name: Build OPLCOV1 with same toolchain
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ps2dev/ps2dev:v1.3.0 \
            sh -lc 'set -e; apk add --no-cache build-base git zip; make EE_CFLAGS="-D_EE -DNEWLIB_PORT_AWARE -include io_common.h -include errno.h -include malloc.h -std=gnu89 -Wno-implicit-function-declaration -Os -mgpopt -G9760"; cp HDLGameInstaller.elf HDLGameInstaller_OPLCOV1_GCC11.elf; file HDLGameInstaller_BASELINE_GCC11.elf HDLGameInstaller_OPLCOV1_GCC11.elf; sha256sum HDLGameInstaller_BASELINE_GCC11.elf HDLGameInstaller_OPLCOV1_GCC11.elf'

      - name: Upload test pair
        uses: actions/upload-artifact@v4
        with:
          name: HDLGameInstaller-GCC11-test-pair
          path: |
            HDLGameInstaller_BASELINE_GCC11.elf
            HDLGameInstaller_OPLCOV1_GCC11.elf
