name: Build OPLCOV1 ELF

on:
  push:
    branches:
      - oplcov1
  workflow_dispatch:

jobs:
  build:
    name: HDLGameInstaller OPLCOV1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply OPLCOV1 patch
        run: |
          python3 oplcov1/patch_oplcov1.py "$GITHUB_WORKSPACE"

      - name: Compile with official PS2DEV v1.0 toolchain
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ps2dev/ps2dev:v1.0 \
            sh -lc 'set -e; apk add --no-cache build-base git zip; mips64r5900el-ps2-elf-gcc --version; make EE_CC=mips64r5900el-ps2-elf-gcc EE_AS=mips64r5900el-ps2-elf-as; cp HDLGameInstaller.elf HDLGameInstaller_OPLCOV1.elf'

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: HDLGameInstaller-OPLCOV1-v1.0toolchain
          path: HDLGameInstaller_OPLCOV1.elf
